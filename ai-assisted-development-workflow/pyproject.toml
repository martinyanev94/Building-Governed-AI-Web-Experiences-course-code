[project]
name = "ai-assisted-development-workflow"
version = "0.1.0"
description = "Evidence-based testing and delivery workflow"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
